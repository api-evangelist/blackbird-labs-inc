aid: blackbird-labs-inc
name: Blackbird Labs Inc
description: 'Blackbird Labs is the company behind Blackbird, a payments-and-loyalty
  app for the restaurant industry. Diners earn status, perks, points, and the $FLY
  rewards token by checking in and paying at partner restaurants, while restaurants
  gain a direct guest relationship and improved economics. Settlement runs on Flynet,
  a layer-three protocol built on Coinbase''s Base blockchain. Founded by Resy and
  Eater co-founder Ben Leventhal, Blackbird is live across cities including New York,
  San Francisco, Charleston, Denver, and New Orleans, and raised $50 million in 2025.
  Backed by investors including QED Investors and Andreessen Horowitz (a16z crypto).
  Blackbird is a consumer application and does not currently publish a public developer
  API, OpenAPI description, or developer portal; this profile captures its public
  company and security posture surface.'
